
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi QR - SMAN 2 Payakumbuh</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #1e293b;
      background: linear-gradient(135deg, #172554, #4338ca);
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      border-radius: 22px;
      text-align: center;
      background: white;
      box-shadow: 0 15px 40px #0004;
    }
    .logo {
      width: 70px;
      height: 70px;
      margin: auto;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #4338ca;
      color: white;
      font-size: 26px;
      font-weight: bold;
    }
    h1 { font-size: 22px; }
    p { color: #64748b; line-height: 1.6; }
    a {
      display: block;
      margin-top: 24px;
      padding: 15px;
      border-radius: 12px;
      background: #4338ca;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">S2</div>
    <h1>ABSENSI QR</h1>
    <h3>SMAN 2 PAYAKUMBUH</h3>
    <p>Sistem absensi siswa menggunakan QR Code.</p>
    <a href="GANTI_DENGAN_URL_WEB_APP_ANDA">
      BUKA APLIKASI ABSENSI
    </a>
  </div>
</body>
</html>
