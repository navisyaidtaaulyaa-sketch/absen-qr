
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner QR Absensi - SMAN 2 Payakumbuh</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 22px 10px;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: auto auto 12px;
      border-radius: 20px;
      background: #4f46e5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 13px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 15px;
      border: 1px solid #334155;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-start {
      background: #4f46e5;
      color: white;
    }

    .btn-stop {
      background: #dc2626;
      color: white;
    }

    .btn-again {
      background: #059669;
      color: white;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    #reader video {
      border-radius: 12px;
      object-fit: cover;
    }

    .status {
      background: #0f172a;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }

    .waiting {
      color: #facc15;
    }

    .info {
      color: #94a3b8;
      font-size: 12px;
      text-align: center;
      margin-top: 18px;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">S2</div>

    <h1>SCANNER ABSENSI QR</h1>

    <p class="subtitle">
      SMAN 2 PAYAKUMBUH
    </p>
  </div>

  <div class="card">

    <button
      class="btn-start"
      id="btnStart"
      onclick="mulaiScanner()">
      📷 MULAI SCAN QR
    </button>

    <button
      class="btn-stop hidden"
      id="btnStop"
      onclick="hentikanScanner()">
      MATIKAN KAMERA
    </button>

  </div>

  <div class="card">

    <div id="reader"></div>

    <div id="status" class="status waiting">
      Kamera belum diaktifkan.
    </div>

    <button
      class="btn-again hidden"
      id="btnAgain"
      onclick="scanLagi()">
      SCAN SISWA BERIKUTNYA
    </button>

  </div>

  <p class="info">
    SISTEM ABSENSI DIGITAL<br>
    SMAN 2 PAYAKUMBUH<br>
    Arahkan kamera ke QR Code siswa.
  </p>

</div>

<script>

// =====================================
// KONFIGURASI GOOGLE APPS SCRIPT
// =====================================

const GAS_WEB_APP_URL =
  "https://script.google.com/macros/s/ISI_ID_DEPLOYMENT/exec";

// Alamat GitHub Pages
const GAS_ORIGIN =
  "https://USERNAME.github.io";

// =====================================
// VARIABEL SCANNER
// =====================================

let scanner = null;
let kameraAktif = false;
let sedangMengirim = false;

const statusBox = document.getElementById("status");
const btnStart = document.getElementById("btnStart");
const btnStop = document.getElementById("btnStop");
const btnAgain = document.getElementById("btnAgain");

// =====================================
// STATUS SCANNER
// =====================================

function tampilStatus(pesan, jenis = "waiting") {
  statusBox.className = "status " + jenis;
  statusBox.textContent = pesan;
}

// =====================================
// MULAI KAMERA
// =====================================

async function mulaiScanner() {

  if (!window.isSecureContext) {
    tampilStatus(
      "Scanner harus dibuka melalui HTTPS GitHub Pages.",
      "error"
    );
    return;
  }

  btnStart.disabled = true;

  tampilStatus(
    "Meminta izin kamera...",
    "waiting"
  );

  try {

    if (!scanner) {
      scanner = new Html5Qrcode("reader");
    }

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: {
          width: 230,
          height: 230
        },
        aspectRatio: 1
      },
      hasilScan,
      function () {}
    );

    kameraAktif = true;

    btnStart.classList.add("hidden");
    btnStop.classList.remove("hidden");

    tampilStatus(
      "Kamera aktif. Silakan scan QR Code siswa.",
      "success"
    );

  } catch (error) {

    tampilStatus(
      "Kamera gagal dibuka: " + error,
      "error"
    );

    btnStart.disabled = false;
  }
}

// =====================================
// HASIL SCAN QR
// =====================================

async function hasilScan(qrText) {

  if (sedangMengirim) return;

  sedangMengirim = true;

  const idSiswa = String(qrText).trim();

  if (!idSiswa) {
    sedangMengirim = false;
    return;
  }

  try {

    await hentikanKameraInternal();

    tampilStatus(
      "QR berhasil dibaca.\nMengirim data absensi...",
      "waiting"
    );

    kirimKeGoogleSheets(idSiswa);

  } catch (error) {

    sedangMengirim = false;

    tampilStatus(
      "Gagal memproses QR: " + error,
      "error"
    );
  }
}

// =====================================
// KIRIM DATA KE GOOGLE SPREADSHEET
// =====================================

function kirimKeGoogleSheets(idSiswa) {

  if (!GAS_WEB_APP_URL.endsWith("/exec")) {

    sedangMengirim = false;

    tampilStatus(
      "URL Google Apps Script belum diatur.",
      "error"
    );

    btnAgain.classList.remove("hidden");
    return;
  }

  const callbackName =
    "callbackAbsensi" + Date.now();

  const script = document.createElement("script");

  let selesai = false;

  const timeout = setTimeout(() => {

    if (selesai) return;

    selesai = true;

    delete window[callbackName];
    script.remove();

    sedangMengirim = false;

    tampilStatus(
      "Koneksi server gagal atau terlalu lama.",
      "error"
    );

    btnAgain.classList.remove("hidden");

  }, 20000);

  window[callbackName] = function(hasil) {

    if (selesai) return;

    selesai = true;

    clearTimeout(timeout);

    delete window[callbackName];
    script.remove();

    sedangMengirim = false;

    if (hasil && hasil.success) {

      tampilStatus(
        "ABSENSI BERHASIL!\n\n" +
        "Nama: " + hasil.nama +
        "\nKelas: " + hasil.kelas,
        "success"
      );

    } else {

      tampilStatus(
        hasil && hasil.message
          ? hasil.message
          : "Absensi gagal.",
        "error"
      );
    }

    btnAgain.classList.remove("hidden");
  };

  script.onerror = function() {

    if (selesai) return;

    selesai = true;

    clearTimeout(timeout);

    delete window[callbackName];
    script.remove();

    sedangMengirim = false;

    tampilStatus(
      "Tidak dapat menghubungi server absensi.",
      "error"
    );

    btnAgain.classList.remove("hidden");
  };

  const url = new URL(GAS_WEB_APP_URL);

  url.searchParams.set("action", "scan");
  url.searchParams.set("id", idSiswa);

  // Tidak lagi mengirim nama guru dan mata pelajaran
  url.searchParams.set("origin", GAS_ORIGIN);
  url.searchParams.set("callback", callbackName);

  script.src = url.toString();

  document.body.appendChild(script);
}

// =====================================
// HENTIKAN KAMERA INTERNAL
// =====================================

async function hentikanKameraInternal() {

  if (scanner && kameraAktif) {

    await scanner.stop();

    kameraAktif = false;
  }

  btnStop.classList.add("hidden");
  btnStart.classList.remove("hidden");
  btnStart.disabled = false;
}

// =====================================
// MATIKAN KAMERA
// =====================================

async function hentikanScanner() {

  try {

    await hentikanKameraInternal();

    tampilStatus(
      "Kamera berhasil dimatikan.",
      "waiting"
    );

  } catch (error) {

    tampilStatus(
      "Gagal mematikan kamera: " + error,
      "error"
    );
  }
}

// =====================================
// SCAN SISWA BERIKUTNYA
// =====================================

function scanLagi() {

  btnAgain.classList.add("hidden");

  sedangMengirim = false;

  mulaiScanner();
}

// =====================================
// KETIKA HALAMAN DITUTUP
// =====================================

window.addEventListener("pagehide", function() {

  if (scanner && kameraAktif) {
    scanner.stop().catch(function() {});
  }

});

</script>

</body>
</html>
