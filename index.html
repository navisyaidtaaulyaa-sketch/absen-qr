
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">

  <title>Absensi QR - SMAN 2 Payakumbuh</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 25px 10px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 15px;
      border-radius: 22px;
      background: linear-gradient(135deg, #6366f1, #4338ca);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: bold;
      box-shadow: 0 8px 25px rgba(79, 70, 229, .35);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 13px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }

    .section-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: .2s;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-start {
      background: #4f46e5;
      color: white;
    }

    .btn-stop {
      background: #dc2626;
      color: white;
    }

    .btn-again {
      background: #059669;
      color: white;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    #reader video {
      object-fit: cover;
      border-radius: 12px;
    }

    #reader__scan_region {
      min-height: 200px;
    }

    .status {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .success {
      color: #4ade80;
      border: 1px solid #166534;
    }

    .error {
      color: #f87171;
      border: 1px solid #991b1b;
    }

    .waiting {
      color: #facc15;
      border: 1px solid #854d0e;
    }

    .info {
      color: #94a3b8;
      font-size: 12px;
      text-align: center;
      margin-top: 20px;
      line-height: 1.8;
    }

    .hidden {
      display: none !important;
    }

    .result-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .student-info {
      background: #0f172a;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
      line-height: 1.8;
      font-size: 14px;
      text-align: left;
    }

    .student-info strong {
      color: #a5b4fc;
    }

    .camera-note {
      color: #94a3b8;
      text-align: center;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">S2</div>

    <h1>SCANNER ABSENSI QR</h1>

    <p class="subtitle">
      SMAN 2 PAYAKUMBUH
    </p>
  </div>

  <!-- KONTROL KAMERA -->
  <div class="card">

    <div class="section-title">
      📷 Pemindai QR Code Siswa
    </div>

    <button
      class="btn-start"
      id="btnStart"
      type="button"
      onclick="mulaiScanner()">
      MULAI SCAN QR
    </button>

    <button
      class="btn-stop hidden"
      id="btnStop"
      type="button"
      onclick="hentikanScanner()">
      MATIKAN KAMERA
    </button>

    <p class="camera-note">
      Tekan tombol mulai untuk mengaktifkan kamera belakang HP.
    </p>

  </div>

  <!-- AREA SCANNER -->
  <div class="card">

    <div id="reader"></div>

    <div
      id="status"
      class="status waiting">
      Kamera belum diaktifkan.
    </div>

    <div
      id="studentInfo"
      class="student-info hidden">
    </div>

    <button
      class="btn-again hidden"
      id="btnAgain"
      type="button"
      onclick="scanLagi()">
      SCAN SISWA BERIKUTNYA
    </button>

  </div>

  <!-- FOOTER -->
  <p class="info">
    SISTEM ABSENSI DIGITAL<br>
    SMAN 2 PAYAKUMBUH<br>
    <br>
    Scan QR Code masing-masing siswa
    untuk melakukan absensi.
  </p>

</div>

<script>

// ============================================
// KONFIGURASI GOOGLE APPS SCRIPT
// ============================================

// GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT
const GAS_WEB_APP_URL =
  "https://script.google.com/macros/s/ISI_ID_DEPLOYMENT/exec";

// GANTI USERNAME DENGAN USERNAME GITHUB
const GAS_ORIGIN =
  "https://USERNAME.github.io";

// ============================================
// VARIABEL APLIKASI
// ============================================

let scanner = null;
let kameraAktif = false;
let sedangMengirim = false;

const statusBox = document.getElementById("status");
const studentInfo = document.getElementById("studentInfo");

const btnStart = document.getElementById("btnStart");
const btnStop = document.getElementById("btnStop");
const btnAgain = document.getElementById("btnAgain");

// ============================================
// FUNGSI STATUS
// ============================================

function tampilStatus(pesan, jenis = "waiting") {

  statusBox.className = "status " + jenis;

  statusBox.textContent = pesan;
}

// ============================================
// FUNGSI MULAI SCANNER
// ============================================

async function mulaiScanner() {

  if (sedangMengirim) {
    return;
  }

  if (!window.isSecureContext) {

    tampilStatus(
      "Scanner harus dibuka melalui HTTPS GitHub Pages.",
      "error"
    );

    return;
  }

  btnStart.disabled = true;

  studentInfo.classList.add("hidden");

  tampilStatus(
    "Meminta izin kamera...",
    "waiting"
  );

  try {

    if (!scanner) {

      scanner = new Html5Qrcode("reader");
    }

    await scanner.start(

      { facingMode: "environment" },

      {
        fps: 10,

        qrbox: {
          width: 230,
          height: 230
        },

        aspectRatio: 1
      },

      hasilScan,

      function () {}

    );

    kameraAktif = true;

    btnStart.classList.add("hidden");

    btnStop.classList.remove("hidden");

    tampilStatus(
      "KAMERA AKTIF\nArahkan kamera ke QR Code siswa.",
      "success"
    );

  } catch (error) {

    btnStart.disabled = false;

    tampilStatus(
      "KAMERA GAGAL DIBUKA:\n" + error,
      "error"
    );

  }
}

// ============================================
// HASIL PEMINDAIAN QR CODE
// ============================================

async function hasilScan(qrText) {

  if (sedangMengirim) {
    return;
  }

  sedangMengirim = true;

  const idSiswa = String(qrText).trim();

  if (!idSiswa) {

    sedangMengirim = false;

    return;
  }

  try {

    await hentikanKameraInternal();

    tampilStatus(
      "QR BERHASIL DIBACA\nMengirim data absensi...",
      "waiting"
    );

    kirimKeGoogleSheets(idSiswa);

  } catch (error) {

    sedangMengirim = false;

    tampilStatus(
      "Gagal membaca QR:\n" + error,
      "error"
    );

    btnAgain.classList.remove("hidden");

  }
}

// ============================================
// KIRIM DATA KE GOOGLE SPREADSHEET
// ============================================

function kirimKeGoogleSheets(idSiswa) {

  if (
    !GAS_WEB_APP_URL.startsWith("https://") ||
    !GAS_WEB_APP_URL.endsWith("/exec") ||
    GAS_WEB_APP_URL.includes("ISI_ID_DEPLOYMENT")
  ) {

    sedangMengirim = false;

    tampilStatus(
      "URL Google Apps Script belum diatur.",
      "error"
    );

    btnAgain.classList.remove("hidden");

    return;
  }

  const callbackName =
    "callbackAbsensi" + Date.now();

  const script = document.createElement("script");

  let selesai = false;

  const timeout = setTimeout(function() {

    if (selesai) return;

    selesai = true;

    delete window[callbackName];

    script.remove();

    sedangMengirim = false;

    tampilStatus(
      "Koneksi ke server gagal atau terlalu lama.\nPeriksa internet dan URL Web App.",
      "error"
    );

    btnAgain.classList.remove("hidden");

  }, 20000);

  window[callbackName] = function(hasil) {

    if (selesai) return;

    selesai = true;

    clearTimeout(timeout);

    delete window[callbackName];

    script.remove();

    sedangMengirim = false;

    if (hasil && hasil.success === true) {

      tampilStatus(
        "ABSENSI BERHASIL!",
        "success"
      );

      studentInfo.innerHTML =
        '<div class="result-title">✓ DATA SISWA</div>' +
        '<strong>Nama:</strong> ' +
        aman(hasil.nama) +
        '<br>' +
        '<strong>Kelas:</strong> ' +
        aman(hasil.kelas);

      studentInfo.classList.remove("hidden");

    } else {

      tampilStatus(
        hasil && hasil.message
          ? hasil.message
          : "ABSENSI GAGAL!",
        "error"
      );

      studentInfo.classList.add("hidden");
    }

    btnAgain.classList.remove("hidden");

  };

  script.onerror = function() {

    if (selesai) return;

    selesai = true;

    clearTimeout(timeout);

    delete window[callbackName];

    script.remove();

    sedangMengirim = false;

    tampilStatus(
      "Tidak dapat menghubungi server absensi.",
      "error"
    );

    btnAgain.classList.remove("hidden");

  };

  const url = new URL(GAS_WEB_APP_URL);

  url.searchParams.set("action", "scan");

  url.searchParams.set("id", idSiswa);

  url.searchParams.set("origin", GAS_ORIGIN);

  url.searchParams.set("callback", callbackName);

  script.src = url.toString();

  document.body.appendChild(script);

}

// ============================================
// MENCEGAH HTML DARI DATA SISWA
// ============================================

function aman(teks) {

  const div = document.createElement("div");

  div.textContent = String(teks ?? "");

  return div.innerHTML;
}

// ============================================
// HENTIKAN KAMERA INTERNAL
// ============================================

async function hentikanKameraInternal() {

  if (scanner && kameraAktif) {

    await scanner.stop();

    kameraAktif = false;
  }

  btnStop.classList.add("hidden");

  btnStart.classList.remove("hidden");

  btnStart.disabled = false;

}

// ============================================
// TOMBOL MATIKAN KAMERA
// ============================================

async function hentikanScanner() {

  try {

    await hentikanKameraInternal();

    tampilStatus(
      "KAMERA BERHASIL DIMATIKAN.",
      "waiting"
    );

  } catch (error) {

    tampilStatus(
      "Gagal mematikan kamera:\n" + error,
      "error"
    );

  }

}

// ============================================
// SCAN SISWA BERIKUTNYA
// ============================================

function scanLagi() {

  btnAgain.classList.add("hidden");

  studentInfo.classList.add("hidden");

  sedangMengirim = false;

  mulaiScanner();

}

// ============================================
// BERSIHKAN KAMERA SAAT HALAMAN DITUTUP
// ============================================

window.addEventListener("pagehide", function() {

  if (scanner && kameraAktif) {

    scanner.stop().catch(function() {});

  }

});

</script>

</body>
</html>
