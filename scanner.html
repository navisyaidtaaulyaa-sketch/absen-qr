<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner QR SMAN 2 Payakumbuh</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#f1f5f9;font-family:Arial;color:#172033}
.card{max-width:520px;margin:20px auto;background:white;padding:22px;border-radius:18px;box-shadow:0 8px 25px #0002}
header{text-align:center;background:#101827;color:white;padding:22px;margin:-22px -22px 20px;border-radius:18px 18px 0 0}
header p{color:#bfdbfe;font-size:12px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
.gray{background:#e2e8f0;color:#1e293b}
#reader{width:100%;overflow:hidden;border-radius:12px;margin:15px auto;background:#111827}
.result{margin-top:18px;padding:15px;border-radius:10px;background:#eff6ff;text-align:center;white-space:pre-line;overflow-wrap:anywhere;line-height:1.5}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
</style>
</head>

<body>
<div class="card">
<header>
<h2>SMAN 2 PAYAKUMBUH</h2>
<p>WEB SCANNER ABSENSI QR</p>
</header>

<h3>Scanner QR Siswa</h3>
<p>Arahkan kamera ke QR Code siswa.</p>

<div id="reader"></div>

<button id="btnMulai" onclick="mulaiKamera()">BUKA KAMERA</button>
<button class="gray" onclick="matikanKamera()">MATIKAN KAMERA</button>

<div id="hasil" class="result">Memeriksa koneksi...</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const TOKEN = params.get("token");
const SERVER = params.get("server");

let scanner = null;
let aktif = false;
let proses = false;

const hasil = document.getElementById("hasil");
const tombol = document.getElementById("btnMulai");

function tampil(teks, kelas="") {
  hasil.className = "result " + kelas;
  hasil.textContent = teks;
}

function serverValid() {
  try {
    const u = new URL(SERVER);
    return u.protocol === "https:" &&
      u.hostname === "script.google.com" &&
      u.pathname.includes("/macros/s/") &&
      u.pathname.endsWith("/exec");
  } catch(e) {
    return false;
  }
}

if (!TOKEN || !serverValid()) {
  tampil("Sesi tidak valid. Buka scanner dari menu aplikasi setelah login.", "error");
  tombol.disabled = true;
} else {
  tampil("Koneksi aplikasi ditemukan. Kamera siap dibuka.");
}

async function mulaiKamera() {
  if (!TOKEN || !serverValid()) {
    tampil("Silakan login kembali melalui aplikasi utama.", "error");
    return;
  }

  if (aktif) return;

  try {
    if (!scanner) scanner = new Html5Qrcode("reader");

    tampil("Meminta izin kamera...");

    await scanner.start(
      {facingMode:"environment"},
      {
        fps:10,
        qrbox:(w,h)=>{
          const size=Math.floor(Math.min(w,h)*0.75);
          return {width:size,height:size};
        }
      },
      teks=>{
        if (proses) return;
        proses = true;
        kirimScan(teks);
      },
      ()=>{}
    );

    aktif = true;
    tombol.disabled = true;
    tampil("KAMERA AKTIF. Arahkan ke QR siswa.");

  } catch(e) {
    aktif = false;
    tombol.disabled = false;
    tampil("Kamera gagal dibuka: "+e.message+
      "\nIzinkan akses kamera pada situs GitHub Pages.", "error");
  }
}

async function matikanKamera() {
  try {
    if (scanner && aktif) await scanner.stop();
  } catch(e) {}

  aktif = false;
  proses = false;
  tombol.disabled = false;
  tampil("Kamera dimatikan.");
}

function kirimScan(teks) {
  const id = String(teks || "").trim();

  if (!id) {
    proses = false;
    tampil("QR Code kosong.", "error");
    return;
  }

  tampil("QR terbaca. Mengirim ke server...");

  const callback = "cb_" + Date.now() + "_" +
    Math.floor(Math.random()*100000);

  const script = document.createElement("script");
  let selesai = false;

  function bersihkan() {
    if (script.parentNode) script.parentNode.removeChild(script);
    delete window[callback];
    clearTimeout(timer);
  }

  const timer = setTimeout(()=>{
    if (selesai) return;
    selesai = true;
    bersihkan();
    proses = false;
    tampil("Server tidak merespons. Periksa internet dan sesi login.", "error");
  },25000);

  window[callback] = res=>{
    if (selesai) return;
    selesai = true;
    bersihkan();

    if (res && res.success) {
      tampil(
        "✓ "+res.message+
        "\nNama: "+res.nama+
        "\nKelas: "+res.kelas+
        "\nWaktu: "+res.waktu,
        "success"
      );
    } else {
      tampil("GAGAL: "+(res?.message || "Respons server tidak valid."), "error");
    }

    setTimeout(()=>{
      proses = false;
      if (aktif) tampil("Siap memindai siswa berikutnya.");
    },2500);
  };

  const url = new URL(SERVER);
  url.searchParams.set("action","scan");
  url.searchParams.set("id",id);
  url.searchParams.set("token",TOKEN);
  url.searchParams.set("callback",callback);
  url.searchParams.set("_",Date.now());

  script.src = url.toString();

  script.onerror = ()=>{
    if (selesai) return;
    selesai = true;
    bersihkan();
    proses = false;
    tampil("Gagal menghubungi server. Periksa deployment Apps Script.", "error");
  };

  document.body.appendChild(script);
}

window.addEventListener("load",()=>{
  if (TOKEN && serverValid()) {
    setTimeout(mulaiKamera,700);
  }
});
</script>
</body>
</html>
